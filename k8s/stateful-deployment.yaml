apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ledger-engine
  namespace: enterprise-ledger
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: enterprise-ledger-engine
  template:
    metadata:
      labels:
        app: enterprise-ledger-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ledger-core
          image: ghcr.io/valelethiajohnson/enterprise-ledger-engine:latest
          ports:
            - containerPort: 4001
          resources:
            requests:
              cpu: '1000m'
              memory: '1Gi'
            limits:
              cpu: '2000m'
              memory: '2Gi'
