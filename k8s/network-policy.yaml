apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-zero-trust-mesh
  namespace: enterprise-ledger
spec:
  podSelector:
    matchLabels:
      app: enterprise-ledger-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: payment-orchestration
      ports:
        - protocol: TCP
          port: 4001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-ledger-primary
      ports:
        - protocol: TCP
          port: 5432
